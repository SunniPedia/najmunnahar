<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>সহযোগী কার্যতালিকা — Work Tracker</title>
  <meta name="description" content="Tasker — ঘরে বসে কিতাব সম্পাদনার সহজ ওয়েব প্ল্যাটফর্ম।">
  <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M4 4.5C4 3.7 4.7 3 5.5 3H12v18H5.5C4.7 21 4 20.3 4 19.5V4.5Z" fill="currentColor" opacity="0.9"/>
          <path d="M20 4.5C20 3.7 19.3 3 18.5 3H12v18h6.5c.8 0 1.5-.7 1.5-1.5V4.5Z" fill="currentColor" opacity="0.55"/>
        </svg>
      </span>
      <div class="brand-text">
        <span class="brand-eyebrow">TASKER</span>
        <span class="brand-title">সহযোগী কার্যতালিকা</span>
      </div>
    </div>
    <button id="refreshBtn" class="ghostBtn" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      রিফ্রেশ
    </button>
  </header>

  <div class="container">
    <aside class="sidebar">
      <ul id="workerList" class="worker-list"></ul>
    </aside>

    <main class="main">
      <section id="emptyState" class="empty-state">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
        <p>বাম পাশ থেকে একজন সহযোগী নির্বাচন করুন তার কাজ দেখতে ও নতুন কাজ যোগ করতে</p>
      </section>

      <section id="workSection" class="hidden">
        <header class="worker-header">
          <div class="worker-avatar" id="workerAvatar">স</div>
          <div>
            <h1 id="workerTitle">সহযোগী সিলেক্ট করুন</h1>
            <div id="statusArea" class="status-line"></div>
          </div>
        </header>

        <div class="card form-card">
          <h3 id="formTitle" class="card-title">নতুন কাজ যোগ করুন</h3>
          <form id="workForm">
            <input type="hidden" id="workerId" />
            <input type="hidden" id="workId" value="" />
            <div class="row">
              <div class="field">
                <label for="bookName">কিতাবের নাম</label>
                <input required type="text" id="bookName" placeholder="যেমনঃ ফাতহুল বারী" />
              </div>
              <div class="field">
                <label for="authorName">লেখকের নাম</label>
                <input required type="text" id="authorName" placeholder="যেমনঃ ইবনে হাজার আসকালানী" />
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label for="startTime">কাজ শুরুর সময়</label>
                <input required type="datetime-local" id="startTime" />
              </div>
              <div class="field">
                <label for="endTime">কাজ শেষের সময় <span class="optional-tag">ঐচ্ছিক · চলমান থাকলে খালি রাখুন</span></label>
                <input type="datetime-local" id="endTime" />
              </div>
            </div>
            <div class="row buttons">
              <button type="submit" id="saveBtn" class="primaryBtn">সংরক্ষণ করুন</button>
              <button type="button" id="clearBtn" class="ghostBtn">বাতিল</button>
            </div>
          </form>
        </div>

        <div class="card table-card">
          <h3 class="card-title">কাজের তালিকা</h3>
          <div class="table-wrap">
            <table id="worksTable">
              <thead>
                <tr><th class="col-serial">#</th><th>কিতাবের নাম</th><th>লেখক</th><th>শুরু</th><th>শেষ</th><th class="col-action">অ্যাকশন</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
<div id="toastArea" class="toast-area" aria-live="polite"></div>
<script src="app.js?v=2"></script>
</body>
</html>
