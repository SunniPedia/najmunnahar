<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
<title>সহযোগী কার্যতালিকা — Work Tracker</title>
<meta name="description" content="Tasker — ঘরে বসে কিতাব সম্পাদনার সহজ ওয়েব প্ল্যাটফর্ম।">
<link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =========================================================
   সহযোগী কার্যতালিকা — design tokens
   Palette: ink navy / manuscript teal / brass gold / parchment
   ========================================================= */
:root{
  --ink:        #1E2A38;
  --ink-soft:   #33475e;
  --teal:       #2F5D50;
  --teal-soft:  #3f7767;
  --gold:       #a9812f;
  --gold-soft:  #d9b978;
  --parchment:  #f4efe0;
  --paper:      #fffdf7;
  --border:     #e6dcc0;
  --text:       #2a241d;
  --muted:      #8a8172;
  --danger:     #a6432b;
  --danger-bg:  #f6e5df;
  --success:    #2f5d50;

  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 8px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;

  --shadow-sm: 0 1px 2px rgba(30,42,56,0.06);
  --shadow-md: 0 6px 20px -6px rgba(30,42,56,0.16);
  --shadow-lg: 0 16px 40px -12px rgba(30,42,56,0.22);

  --font-bn: 'SolaimanLipi', Arial, sans-serif;
  --font-display: 'Fraunces', 'SolaimanLipi', serif;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; width:100%; max-width:100%; overflow-x:hidden; margin:0; padding:0; }
body{
  margin:0; padding:0; width:100%; max-width:100%; overflow-x:hidden;
  font-family: var(--font-bn);
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(169,129,47,0.08), transparent 60%),
    var(--parchment);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4,h5,h6,p,label,span,button,input,textarea,select,th,td,li{ font-family: var(--font-bn); }
::selection{ background: var(--gold-soft); color: var(--ink); }
a:focus-visible, button:focus-visible, input:focus-visible, li:focus-visible{
  outline: 2px solid var(--teal); outline-offset: 2px;
}

.app-shell{ min-height:100vh; display:flex; flex-direction:column; width:100% !important; max-width:100vw !important; overflow-x:hidden; }

.topbar{
  display:flex !important; align-items:center !important; justify-content:space-between !important;
  padding:13px 24px; background: var(--ink); color:#fff;
  box-shadow: var(--shadow-md);
  position: sticky !important; top:0 !important; z-index:100 !important;
  width:100% !important; max-width:100% !important; min-width:100% !important;
  margin:0 !important; left:0 !important; right:0 !important;
  box-sizing:border-box !important; border-radius:0 !important;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-mark{
  width:36px; height:36px; border-radius:10px;
  background: linear-gradient(150deg, var(--gold-soft), var(--gold));
  color: var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.brand-text{ display:flex; flex-direction:column; line-height:1.2; }
.brand-eyebrow{
  font-family: var(--font-display); font-style: italic; font-size:11px;
  letter-spacing:0.14em; text-transform:uppercase; color: var(--gold-soft);
}
.brand-title{ font-size:16.5px; font-weight:700; color:#fdfaf2; }

.container{
  display:flex; align-items:flex-start; gap:0; flex:1;
  width:100% !important; max-width:1180px !important; margin:0 auto !important; box-sizing:border-box;
}

.sidebar{
  width:264px; flex-shrink:0; padding:16px 14px 32px;
  position: sticky; top:60px; align-self:flex-start;
  max-height: calc(100vh - 60px); overflow-y:auto;
}
.worker-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.worker-card{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border-radius: var(--radius-md); background: var(--paper); border:1px solid var(--border);
  cursor:pointer; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
}
.worker-card:hover{ transform: translateY(-1px); box-shadow: var(--shadow-sm); border-color: var(--gold-soft); }
.worker-card.active{
  border-color: var(--teal);
  background: linear-gradient(0deg, rgba(47,93,80,0.07), rgba(47,93,80,0.07)), var(--paper);
  box-shadow: var(--shadow-sm);
}
.worker-avatar-sm{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background: var(--ink); color:#fdfaf2; font-weight:700; font-size:13.5px;
}
.worker-meta{ flex:1; min-width:0; }
.worker-name{
  font-weight:700; font-size:14px; color: var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3;
}
.worker-position{ font-size:11.5px; color: var(--muted); line-height:1.3; }
.badge{
  font-size:10.5px; padding:3px 7px; border-radius:999px; white-space:nowrap; font-weight:600;
  display:inline-flex; align-items:center; gap:4px; flex-shrink:0;
}
.badge::before{ content:""; width:6px; height:6px; border-radius:50%; background: currentColor; flex-shrink:0; }
.activeTick{ background:#e9f2ee; color: var(--teal); }
.inactiveTick{ background:#f1efe7; color:#9a9280; }

.main{ flex:1; min-width:0; padding:20px 22px 56px; display:flex; flex-direction:column; }
.empty-state{
  flex:1; min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; text-align:center; color: var(--muted); padding: 40px 20px; margin:0;
}
.empty-state svg{ color: var(--gold); }
.empty-state p{ max-width:300px; font-size:14.5px; margin:0; }
.hidden{ display:none !important; }

.worker-header{ display:flex; align-items:center; gap:14px; padding: 2px 2px 18px; }
.worker-avatar{
  width:48px; height:48px; border-radius:13px;
  background: linear-gradient(155deg, var(--teal-soft), var(--ink));
  color:#fdfaf2; display:flex; align-items:center; justify-content:center;
  font-size:19px; font-weight:700; box-shadow: var(--shadow-sm); flex-shrink:0;
}
#workerTitle{ margin:0 0 3px; font-size:19px; color: var(--ink); line-height:1.25; }
.status-line{ font-size:12.5px; color: var(--muted); }

.card{
  background: var(--paper); border:1px solid var(--border); border-radius: var(--radius-lg);
  padding: var(--sp-5); margin-bottom: var(--sp-4); box-shadow: var(--shadow-sm);
  animation: rise .3s ease both;
}
@keyframes rise{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce){ .card{ animation:none; } }

.card-title{
  margin:0 0 var(--sp-4); font-size:14.5px; color: var(--ink);
  padding-bottom: var(--sp-2); border-bottom: 1px solid var(--border);
  display:flex; align-items:center; gap:8px;
}
.card-title::before{ content:""; width:4px; height:15px; border-radius:2px; background: var(--gold); display:inline-block; }

form{ display:flex; flex-direction:column; gap: var(--sp-3); }
form .row{
  display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--sp-3) var(--sp-4); max-width: 620px;
}
.field{ display:flex; flex-direction:column; gap: var(--sp-1); }
.field label{
  font-size:12.5px; font-weight:600; color: var(--ink-soft);
  display:flex; flex-wrap:wrap; align-items:baseline; gap:6px;
}
.optional-tag{ font-weight:400; color: var(--muted); font-size:11px; }

form input[type="text"],
form input[type="number"],
form input[type="datetime-local"]{
  padding:9px 11px; border:1px solid var(--border); border-radius: var(--radius-sm);
  background:#fffefb; font-size:13.5px; color: var(--text);
  transition: border-color .15s ease, box-shadow .15s ease; width:100%;
}
form input:focus{ border-color: var(--teal); box-shadow: 0 0 0 3px rgba(47,93,80,0.12); outline:none; }
form input::placeholder{ color:#b5ac99; }

.buttons{ display:flex; gap:10px; margin-top: var(--sp-1); max-width:none; }

button{
  font-family: var(--font-bn); cursor:pointer; border:none; border-radius: var(--radius-sm);
  padding:9px 16px; font-size:13.5px; font-weight:700;
  display:inline-flex; align-items:center; gap:7px;
  transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
}
button:active{ transform: translateY(1px); }
button:disabled{ opacity:.6; cursor:not-allowed; }

.primaryBtn{ background: linear-gradient(155deg, var(--teal-soft), var(--teal)); color:#fdfaf2; box-shadow: var(--shadow-sm); }
.primaryBtn:hover{ box-shadow: var(--shadow-md); }

.ghostBtn{ background: transparent; color: var(--ink-soft); border:1px solid var(--border); }
.topbar .ghostBtn{ color:#fdfaf2; border-color: rgba(255,255,255,0.25); }
.topbar .ghostBtn:hover{ border-color: var(--gold-soft); color: var(--gold-soft); }
.ghostBtn:hover{ border-color: var(--teal); color: var(--teal); }

.table-wrap{ overflow:auto; max-height:420px; display:block; border-radius: var(--radius-md); border:1px solid var(--border); }
table{ width:100%; border-collapse:collapse; background: var(--paper); font-size:13.5px; min-width:680px; }
thead th{
  text-align:left; font-size:12px; letter-spacing:0.03em; text-transform:uppercase; color: var(--muted);
  background: #f2ecd9; padding:10px 12px; border-bottom:2px solid var(--gold-soft); white-space:nowrap;
}
tbody td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; color: var(--text); }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background: rgba(169,129,47,0.06); }
tbody tr:nth-child(even){ background: rgba(47,93,80,0.03); }
tbody tr:nth-child(even):hover{ background: rgba(169,129,47,0.07); }

.col-serial{ width:40px; }
td.serial-cell{ font-family: var(--font-display); font-weight:600; color: var(--gold); }
.col-action{ width:150px; }

.ongoing-tag{
  color: var(--teal); font-weight:600; font-size:12px; background: #e9f2ee;
  padding:2px 8px; border-radius:999px; white-space:nowrap;
}

.rowActions{ display:flex; gap:6px; }
.editBtn, .deleteBtn{ padding:6px 10px; font-size:12px; border-radius: 6px; }
.editBtn{ background:#eef2f7; color: var(--ink-soft); }
.editBtn:hover{ background:#e3e9f1; }
.deleteBtn{ background: var(--danger-bg); color: var(--danger); }
.deleteBtn:hover{ background:#f0d5cb; }

.empty-row td{ text-align:center; padding:24px 12px; color: var(--muted); }

.toast-area{ position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:60; }
.toast{
  min-width:220px; max-width:320px; padding:12px 16px; border-radius: var(--radius-md);
  background: var(--ink); color:#fdfaf2; font-size:13.5px; box-shadow: var(--shadow-lg);
  display:flex; align-items:center; gap:8px; animation: toastIn .25s ease both;
}
.toast.success{ background: var(--teal); }
.toast.error{ background: var(--danger); }
.toast.fade-out{ animation: toastOut .25s ease forwards; }
@keyframes toastIn{ from{ opacity:0; transform: translateY(10px); } to{ opacity:1; transform: translateY(0); } }
@keyframes toastOut{ to{ opacity:0; transform: translateY(6px); } }

.setup-note{
  max-width:520px; margin:60px auto; background:var(--paper); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow-md);
}
.setup-note h2{ margin-top:0; color:var(--ink); }
.setup-note code{ background:#f2ecd9; padding:2px 6px; border-radius:4px; font-size:12.5px; }
.setup-note pre{ background:#f2ecd9; padding:12px; border-radius:8px; overflow-x:auto; font-size:12px; }

@media (max-width: 860px){
  .container{ flex-direction:column; }
  .sidebar{ width:100%; position:static; max-height:none; padding:14px 16px 2px; }
  .worker-list{ flex-direction:row; flex-wrap:wrap; }
  .worker-card{ flex:1 1 220px; }
  .main{ padding:16px; }
  form .row{ grid-template-columns: 1fr; max-width:none; }
  .toast-area{ left:12px; right:12px; }
  .toast{ max-width:none; }
  .topbar{ width:100vw !important; max-width:100vw !important; padding:12px 14px !important; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* =========================================================
   Supabase config
   Replace these two values with your own project's values
   (Supabase dashboard -> Project Settings -> API)
   ========================================================= */
const SUPABASE_URL = "https://qzbguunpgbrogmdkulnx.supabase.co/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6Ymd1dW5wZ2Jyb2dtZGt1bG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDEwMDUsImV4cCI6MjEwNDAxNzAwNX0.isFeqhntLokqIyKjDQ7M29huwSdC-__bGv7jGYHDjH8";

const isConfigured = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 10;
const supabase = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function escapeHtml(s){ return s == null ? '' : String(s); }

function SetupNote(){
  return (
    <div className="setup-note">
      <h2>একটু সেটআপ বাকি আছে</h2>
      <p>এই অ্যাপটি ডেটা রাখার জন্য Supabase ব্যবহার করে, যাতে যেকোনো ডিভাইস থেকে একই ডেটা দেখা যায়। শুরু করতে:</p>
      <ol>
        <li>Supabase.com এ ফ্রি একটি প্রজেক্ট তৈরি করুন</li>
        <li>SQL Editor এ দেওয়া <code>supabase_setup.sql</code> স্ক্রিপ্টটি রান করুন</li>
        <li>Project Settings → API থেকে <code>Project URL</code> ও <code>anon public key</code> কপি করুন</li>
        <li>এই ফাইলের উপরের দিকে <code>SUPABASE_URL</code> ও <code>SUPABASE_ANON_KEY</code> বসিয়ে দিন</li>
      </ol>
      <pre>{`const SUPABASE_URL = "https://xxxx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOi...";`}</pre>
      <p>এরপর ফাইলটি সেভ করে GitHub এ পুশ করলে Vercel অটো ডিপ্লয় করবে।</p>
    </div>
  );
}

function Toasts({ toasts }){
  return (
    <div className="toast-area" aria-live="polite">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type} ${t.fading ? 'fade-out' : ''}`}>{t.msg}</div>
      ))}
    </div>
  );
}

function App(){
  const [workers, setWorkers] = useState([]);
  const [currentWorkerId, setCurrentWorkerId] = useState(null);
  const [works, setWorks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [toasts, setToasts] = useState([]);
  const toastIdRef = useRef(0);

  const [formTitle, setFormTitle] = useState('নতুন কাজ যোগ করুন');
  const [editId, setEditId] = useState('');
  const [bookName, setBookName] = useState('');
  const [authorName, setAuthorName] = useState('');
  const [startTime, setStartTime] = useState('');
  const [endTime, setEndTime] = useState('');
  const [saving, setSaving] = useState(false);

  const showToast = useCallback((msg, type='success') => {
    const id = ++toastIdRef.current;
    setToasts(prev => [...prev, { id, msg, type, fading:false }]);
    setTimeout(() => {
      setToasts(prev => prev.map(t => t.id===id ? {...t, fading:true} : t));
      setTimeout(() => setToasts(prev => prev.filter(t => t.id!==id)), 250);
    }, 3000);
  }, []);

  const fetchWorkers = useCallback(async () => {
    const { data, error } = await supabase.from('workers').select('*').order('id');
    if(error){ showToast('ডেটা লোড সমস্যা: ' + error.message, 'error'); return []; }
    return data || [];
  }, [showToast]);

  const fetchWorksFor = useCallback(async (workerId) => {
    const { data, error } = await supabase.from('works').select('*').eq('worker_id', workerId);
    if(error){ showToast('কাজের তালিকা লোড সমস্যা: ' + error.message, 'error'); return []; }
    return data || [];
  }, [showToast]);

  const loadAll = useCallback(async () => {
    const w = await fetchWorkers();
    setWorkers(w);
    return w;
  }, [fetchWorkers]);

  useEffect(() => {
    if(!isConfigured){ setLoading(false); return; }
    (async () => {
      const w = await loadAll();
      setLoading(false);
      if(w.length === 1) selectWorker(w[0].id);
    })();
    // eslint-disable-next-line
  }, []);

  const resetForm = () => {
    setEditId(''); setBookName(''); setAuthorName(''); setStartTime(''); setEndTime('');
    setFormTitle('নতুন কাজ যোগ করুন');
  };

  const selectWorker = async (id) => {
    setCurrentWorkerId(id);
    resetForm();
    const w = await fetchWorksFor(id);
    setWorks(w);
  };

  const currentWorker = workers.find(w => w.id === currentWorkerId) || null;

  const sortedWorks = [...works].sort((a,b) => new Date(b.start_time||0) - new Date(a.start_time||0));

  const handleSubmit = async (e) => {
    e.preventDefault();
    if(!currentWorkerId){ showToast('প্রথমে একজন সহযোগী সিলেক্ট করুন', 'error'); return; }
    if(endTime && startTime && endTime < startTime){ showToast('শেষের সময় শুরুর সময়ের আগে হতে পারে না', 'error'); return; }
    setSaving(true);
    try {
      if(editId){
        const { error } = await supabase.from('works').update({
          book_name: bookName.trim(), author_name: authorName.trim(),
          start_time: startTime, end_time: endTime || ''
        }).eq('id', editId);
        if(error) throw error;
      } else {
        const { error } = await supabase.from('works').insert({
          worker_id: currentWorkerId, book_name: bookName.trim(), author_name: authorName.trim(),
          start_time: startTime, end_time: endTime || ''
        });
        if(error) throw error;
      }
      const w = await fetchWorksFor(currentWorkerId);
      setWorks(w);
      showToast('সফলভাবে সংরক্ষণ হয়েছে', 'success');
      resetForm();
    } catch(err){
      showToast('ত্রুটি: ' + (err.message || 'অজানা'), 'error');
    } finally {
      setSaving(false);
    }
  };

  const editWork = (item) => {
    setEditId(item.id);
    setBookName(item.book_name);
    setAuthorName(item.author_name);
    setStartTime(item.start_time || '');
    setEndTime(item.end_time || '');
    setFormTitle('কাজ সম্পাদনা করুন');
    setTimeout(() => {
      document.getElementById('bookName')?.scrollIntoView({ behavior:'smooth', block:'center' });
    }, 0);
  };

  const deleteWork = async (id) => {
    if(!window.confirm('আপনি কি নিশ্চিতভাবে এই কাজটি মুছে ফেলতে চান?')) return;
    try {
      const { error } = await supabase.from('works').delete().eq('id', id);
      if(error) throw error;
      const w = await fetchWorksFor(currentWorkerId);
      setWorks(w);
      showToast('কাজটি মুছে ফেলা হয়েছে', 'success');
    } catch(err){
      showToast('মুছে ফেলা যায়নি: ' + (err.message || ''), 'error');
    }
  };

  const handleRefresh = async () => {
    const w = await loadAll();
    if(currentWorkerId){
      const found = w.find(x => x.id === currentWorkerId);
      if(found) await selectWorker(currentWorkerId);
    }
    showToast('তালিকা রিফ্রেশ হয়েছে', 'success');
  };

  if(!isConfigured){
    return <SetupNote />;
  }

  return (
    <div className="app-shell">
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <path d="M4 4.5C4 3.7 4.7 3 5.5 3H12v18H5.5C4.7 21 4 20.3 4 19.5V4.5Z" fill="currentColor" opacity="0.9"/>
              <path d="M20 4.5C20 3.7 19.3 3 18.5 3H12v18h6.5c.8 0 1.5-.7 1.5-1.5V4.5Z" fill="currentColor" opacity="0.55"/>
            </svg>
          </span>
          <div className="brand-text">
            <span className="brand-eyebrow">TASKER</span>
            <span className="brand-title">সহযোগী কার্যতালিকা</span>
          </div>
        </div>
        <button className="ghostBtn" type="button" onClick={handleRefresh}>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          রিফ্রেশ
        </button>
      </header>

      <div className="container">
        <aside className="sidebar">
          <ul className="worker-list">
            {loading ? null : workers.length === 0 ? (
              <li style={{padding:'12px', color:'#8a8172'}}>কোনো সহযোগী নেই</li>
            ) : workers.map(w => (
              <li
                key={w.id}
                className={"worker-card" + (currentWorkerId === w.id ? " active" : "")}
                tabIndex={0}
                onClick={() => selectWorker(w.id)}
                onKeyDown={(e) => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectWorker(w.id); } }}
              >
                <div className="worker-avatar-sm">{(w.name||'?').trim().charAt(0)}</div>
                <div className="worker-meta">
                  <div className="worker-name">{escapeHtml(w.name)}</div>
                  <div className="worker-position">{escapeHtml(w.position||'')}</div>
                </div>
                <span className={"badge " + (w.blue_tick ? "activeTick" : "inactiveTick")}>
                  {w.blue_tick ? 'সক্রিয়' : 'নিষ্ক্রিয়'}
                </span>
              </li>
            ))}
          </ul>
        </aside>

        <main className="main">
          {!currentWorker ? (
            <section className="empty-state">
              <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
              <p>বাম পাশ থেকে একজন সহযোগী নির্বাচন করুন তার কাজ দেখতে ও নতুন কাজ যোগ করতে</p>
            </section>
          ) : (
            <section>
              <header className="worker-header">
                <div className="worker-avatar">{(currentWorker.name||'?').trim().charAt(0)}</div>
                <div>
                  <h1 id="workerTitle">{currentWorker.name} ({currentWorker.position||''})</h1>
                  <div className="status-line">
                    <span className={"badge " + (currentWorker.blue_tick ? "activeTick" : "inactiveTick")}>
                      {currentWorker.blue_tick ? 'সক্রিয়' : 'নিষ্ক্রিয়'}
                    </span>
                  </div>
                </div>
              </header>

              <div className="card form-card">
                <h3 className="card-title">{formTitle}</h3>
                <form onSubmit={handleSubmit}>
                  <div className="row">
                    <div className="field">
                      <label htmlFor="bookName">কিতাবের নাম</label>
                      <input required type="text" id="bookName" placeholder="যেমনঃ ফাতহুল বারী"
                        value={bookName} onChange={e=>setBookName(e.target.value)} />
                    </div>
                    <div className="field">
                      <label htmlFor="authorName">লেখকের নাম</label>
                      <input required type="text" id="authorName" placeholder="যেমনঃ ইবনে হাজার আসকালানী"
                        value={authorName} onChange={e=>setAuthorName(e.target.value)} />
                    </div>
                  </div>
                  <div className="row">
                    <div className="field">
                      <label htmlFor="startTime">কাজ শুরুর সময়</label>
                      <input required type="datetime-local" id="startTime"
                        value={startTime} onChange={e=>setStartTime(e.target.value)} />
                    </div>
                    <div className="field">
                      <label htmlFor="endTime">কাজ শেষের সময় <span className="optional-tag">ঐচ্ছিক · চলমান থাকলে খালি রাখুন</span></label>
                      <input type="datetime-local" id="endTime"
                        value={endTime} onChange={e=>setEndTime(e.target.value)} />
                    </div>
                  </div>
                  <div className="row buttons">
                    <button type="submit" className="primaryBtn" disabled={saving}>
                      {saving ? 'সংরক্ষণ হচ্ছে...' : (editId ? 'আপডেট করুন' : 'সংরক্ষণ করুন')}
                    </button>
                    <button type="button" className="ghostBtn" onClick={resetForm}>বাতিল</button>
                  </div>
                </form>
              </div>

              <div className="card table-card">
                <h3 className="card-title">কাজের তালিকা</h3>
                <div className="table-wrap">
                  <table>
                    <thead>
                      <tr><th className="col-serial">#</th><th>কিতাবের নাম</th><th>লেখক</th><th>শুরু</th><th>শেষ</th><th className="col-action">অ্যাকশন</th></tr>
                    </thead>
                    <tbody>
                      {sortedWorks.length === 0 ? (
                        <tr className="empty-row"><td colSpan="6">এখনো কোনো কাজ যোগ করা হয়নি।</td></tr>
                      ) : sortedWorks.map((item, index) => (
                        <tr key={item.id}>
                          <td className="serial-cell">{index+1}</td>
                          <td>{escapeHtml(item.book_name)}</td>
                          <td>{escapeHtml(item.author_name)}</td>
                          <td>{escapeHtml((item.start_time||'').replace('T',' '))}</td>
                          <td>{item.end_time ? escapeHtml(item.end_time.replace('T',' ')) : <span className="ongoing-tag">চলমান</span>}</td>
                          <td>
                            <div className="rowActions">
                              <button type="button" className="editBtn" onClick={()=>editWork(item)}>সম্পাদনা</button>
                              <button type="button" className="deleteBtn" onClick={()=>deleteWork(item.id)}>মুছুন</button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          )}
        </main>
      </div>
      <Toasts toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
